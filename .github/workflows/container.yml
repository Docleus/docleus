name: Publish container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/docleus/docleus

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read approved source pins
        id: pins
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const pins = JSON.parse(readFileSync('container-release.json', 'utf8'));
          for (const [key, value] of Object.entries(pins)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error(`Invalid ${key}`);
            process.stdout.write(`${key}=${value}\n`);
          }
          JS
      - name: Download and verify frozen sources
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pins.outputs.version }}
          SOURCE_SHA256: ${{ steps.pins.outputs.sourceSha256 }}
          SOURCE_COMMIT: ${{ steps.pins.outputs.sourceCommit }}
        run: |
          mkdir source
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "docleus-$VERSION-sources.tar.gz" --dir source
          cd source
          printf '%s  %s\n' "$SOURCE_SHA256" "docleus-$VERSION-sources.tar.gz" | sha256sum --check
          tar -xzf "docleus-$VERSION-sources.tar.gz"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const root = `docleus-${process.env.VERSION}`;
          const sources = JSON.parse(readFileSync(`${root}/source-set.json`, 'utf8'));
          assert.equal(sources.version, process.env.VERSION);
          assert.equal(sources.repositories.find(repo => repo.name === 'docleus')?.commit, process.env.SOURCE_COMMIT);
          const pkg = JSON.parse(readFileSync(`${root}/docleus/package.json`, 'utf8'));
          assert.equal(pkg.version, process.env.VERSION);
          JS
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build a candidate for the native runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source/docleus-${{ steps.pins.outputs.version }}
          file: source/docleus-${{ steps.pins.outputs.version }}/docleus/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: NODE_IMAGE=${{ steps.pins.outputs.nodeImage }}
          labels: |
            org.opencontainers.image.source=https://github.com/Docleus/docleus
            org.opencontainers.image.revision=${{ steps.pins.outputs.sourceCommit }}
            org.opencontainers.image.version=${{ steps.pins.outputs.version }}
            org.opencontainers.image.licenses=MIT
          tags: docleus:container-candidate
          load: true
          provenance: false
          sbom: false
      - name: Test setup, editing, merge, publication and restart
        env:
          DOCLEUS_IMAGE: docleus:container-candidate
        run: |
          node scripts/smoke.mjs --project container-release --port 3900
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested image by digest
        id: push
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Copy the tested local image instead of rebuilding it after acceptance.
          docker tag docleus:container-candidate "$IMAGE:candidate-$GITHUB_RUN_ID-$ARCH"
          docker push "$IMAGE:candidate-$GITHUB_RUN_ID-$ARCH"
          digest=$(docker image inspect "$IMAGE:candidate-$GITHUB_RUN_ID-$ARCH" --format '{{json .RepoDigests}}' | jq --raw-output --arg prefix "$IMAGE@" '.[] | select(startswith($prefix))')
          test -n "$digest"
          mkdir digests
          printf '%s\n' "$digest" > "digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble the versioned image and attach its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./container-release.json").version')
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "container-$version.json"; then
            echo 'This release already has a container record; refusing to replace it.' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$version" "$(cat digests/amd64)" "$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' > image-index.json
          digest=$(node -p 'JSON.parse(require("node:fs").readFileSync("image-index.json", "utf8")).digest')
          docker logout ghcr.io
          for platform in linux/amd64 linux/arm64; do
            if ! docker pull --platform "$platform" "$IMAGE@$digest"; then
              echo 'Anonymous pull failed. Check GHCR package visibility before rerunning this workflow.' >&2
              exit 1
            fi
            # The classic Docker store cannot keep two platforms under one index reference.
            docker image rm "$IMAGE@$digest"
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const pins = JSON.parse(readFileSync('container-release.json', 'utf8'));
          const index = JSON.parse(readFileSync('image-index.json', 'utf8'));
          const platforms = index.manifests.map(item => `${item.platform.os}/${item.platform.architecture}`).sort();
          assert.deepEqual(platforms, ['linux/amd64', 'linux/arm64']);
          const digest = index.digest;
          assert.match(digest, /^sha256:[a-f0-9]{64}$/);
          const record = {
            ...pins,
            image: process.env.IMAGE,
            digest,
            reference: `${process.env.IMAGE}@${digest}`,
            platforms,
            anonymousPullVerified: true,
            workflowCommit: process.env.GITHUB_SHA,
            run: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            manifests: index.manifests,
          };
          writeFileSync(`container-${pins.version}.json`, `${JSON.stringify(record, null, 2)}\n`);
          JS
          cp .env.example default.env.example
          sha256sum "container-$version.json" compose.small.yaml compose.yaml default.env.example > container-SHA256SUMS
          gh release upload "v$version" --repo "$GITHUB_REPOSITORY" \
            compose.small.yaml compose.yaml default.env.example container-SHA256SUMS --clobber
          gh release upload "v$version" --repo "$GITHUB_REPOSITORY" "container-$version.json"
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json body > release.json
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('container-release.json', 'utf8'));
          const record = JSON.parse(readFileSync(`container-${version}.json`, 'utf8'));
          let { body } = JSON.parse(readFileSync('release.json', 'utf8'));
          body = body.replace(
            'Prebuilt container images and npm registry packages are not published with this preview.',
            'Prebuilt container images are available; npm registry packages remain unpublished.',
          ).replace(
            '`SHA256SUMS`: SHA-256 checksums for the other release attachments.',
            '`SHA256SUMS`: SHA-256 checksums for the source and component attachments.',
          );
          const guide = [
            '## Prebuilt container',
            '',
            'Linux AMD64 and ARM64 images passed setup, editing, merge, publication, restart, and anonymous pull checks.',
            `Build and provenance: ${record.run}. See \`container-${version}.json\` and \`container-SHA256SUMS\`.`,
            '',
            '```sh',
            'mkdir docleus && cd docleus',
            `curl -fLO https://github.com/Docleus/docleus/releases/download/v${version}/compose.small.yaml`,
            `export DOCLEUS_IMAGE=${record.reference}`,
            'docker compose -f compose.small.yaml pull',
            'docker compose -f compose.small.yaml up -d',
            'docker compose -f compose.small.yaml logs docleus',
            '```',
            '',
            'Open http://localhost:3000/setup and use the one-time token from the logs to create the administrator.',
            '',
          ].join('\n');
          writeFileSync('release-notes.md', `${guide}\n${body}`);
          JS
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          cat "container-$version.json" >> "$GITHUB_STEP_SUMMARY"

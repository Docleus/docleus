# Small deployment: one container, SQLite and local files in a volume.
#   docker compose -f compose.small.yaml up -d
# Build the image first from the workspace root (see README), or set
# DOCLEUS_IMAGE to a published one.
services:
  docleus:
    image: ${DOCLEUS_IMAGE:-docleus:0.0.1}
    init: true
    restart: unless-stopped
    ports:
      - "${DOCLEUS_PORT:-3000}:3000"
    environment:
      DOCLEUS_PUBLIC_URL: ${DOCLEUS_PUBLIC_URL:-}
      DOCLEUS_TRUST_PROXY: ${DOCLEUS_TRUST_PROXY:-}
      DOCLEUS_SMTP_URL: ${DOCLEUS_SMTP_URL:-}
      DOCLEUS_SMTP_FROM: ${DOCLEUS_SMTP_FROM:-}
      DOCLEUS_OIDC_ISSUER: ${DOCLEUS_OIDC_ISSUER:-}
      DOCLEUS_OIDC_CLIENT_ID: ${DOCLEUS_OIDC_CLIENT_ID:-}
      DOCLEUS_OIDC_CLIENT_SECRET: ${DOCLEUS_OIDC_CLIENT_SECRET:-}
      DOCLEUS_OIDC_LABEL: ${DOCLEUS_OIDC_LABEL:-}
      # Signs blob URLs; generated once into /data/blob-secret when empty.
      DOCLEUS_BLOB_SECRET: ${DOCLEUS_BLOB_SECRET:-}
    volumes:
      - docleus-data:/data

volumes:
  docleus-data:
